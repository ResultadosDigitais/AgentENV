name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: "Log level for the tests"
        required: false
  pull_request:
    paths-ignore: &ignore_docs
      - "**.md"
      - "**.rst"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/benchmark.yml"
      - ".github/workflows/e2b-benchmark.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/coverage.yml"
      - ".github/workflows/services-ci.yml"
      - ".github/workflows/mutation-tests.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  push:
    paths-ignore: *ignore_docs

env:
  RUST_LOG: ${{ github.event.inputs.log_level || 'info' }}

permissions:
  contents: read
  packages: read

jobs:
  agentenv-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-ci-setup
        with:
          ci_deps_target: ci-deps
      - uses: ./.github/actions/sandbox-ci-setup
        with:
          ghcr_username: ${{ github.actor }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      - name: AgentEnv Integration tests
        run: sg kvm -c "make test-agent-integration PROFILE=debug"
      - uses: ./.github/actions/sandbox-artifacts-cleanup
        if: always()

  e2e-tests:
    name: e2e-tests (${{ matrix.e2e_name }})
    runs-on: ubuntu-latest
    # docker-compose builds the scheduler image, which resolves the build-deps
    # reserve from a private Artifact Registry repository. The federated token
    # is minted per job; no key, secret or pull_request_target is involved.
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        e2e_name: [single-node, docker-compose]
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Artifact Registry through workload identity
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/627931310875/locations/global/workloadIdentityPools/pf-gha-agentenv-fork/providers/services-ci
          service_account: gha-agentenv-fork-ci@rd-sre-stg-01.iam.gserviceaccount.com
      - name: Configure Docker for the build-deps registry
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - uses: ./.github/actions/rust-ci-setup
        with:
          ci_deps_target: ci-deps
      - uses: ./.github/actions/sandbox-ci-setup
        if: ${{ matrix.e2e_name == 'single-node' }}
        with:
          ghcr_username: ${{ github.actor }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure ublk test host
        if: ${{ matrix.e2e_name != 'single-node' }}
        run: sudo scripts/tests/setup-ublk-access.sh "$(id -un)" "$(id -gn)"
      - name: Set up Docker Buildx
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        uses: docker/setup-buildx-action@v4
      - name: Build AgentENV runtime image
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.agentenv
          load: true
          tags: agentenv-runtime:latest
          cache-from: type=gha,scope=agentenv-runtime
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=agentenv-runtime,mode=max' || '' }}
      - name: Build gateway image
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.gateway
          load: true
          tags: agentenv-gateway:latest
          cache-from: type=gha,scope=agentenv-gateway
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=agentenv-gateway,mode=max' || '' }}
      - name: Build scheduler image
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.scheduler
          load: true
          tags: agentenv-scheduler:latest
          cache-from: type=gha,scope=agentenv-scheduler
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=agentenv-scheduler,mode=max' || '' }}
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install e2b CLI
        run: npm install -g @e2b/cli
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install e2b Python SDK
        run: python3 -m pip install --upgrade e2b e2b-code-interpreter
      - name: Prepare BuildKit test client
        run: make build-aenv
      - name: Install BuildKit test client
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/buildkit/install-buildctl.sh "$RUNNER_TEMP/buildkit"
      - name: Single-node E2E tests
        if: ${{ matrix.e2e_name == 'single-node' }}
        env:
          BUILDCTL_BIN: ${{ runner.temp }}/buildkit/buildctl
          CONFIG_PATH: ${{ github.workspace }}/scripts/buildkit/test-config.toml
          AENV_HOME_PATH: ${{ runner.temp }}/aenv-e2e/home
          AENV_RUNTIME_PATH: ${{ runner.temp }}/aenv-e2e/run
        run: sg kvm -c "make test-e2e PROFILE=debug"
      - name: Docker Compose E2E tests
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        env:
          BUILDCTL_BIN: ${{ runner.temp }}/buildkit/buildctl
          CONFIG_PATH: ${{ github.workspace }}/scripts/buildkit/test-config.toml
          SKIP_BUILD: "1"
        run: make test-e2e-compose PROFILE=debug
      - uses: ./.github/actions/sandbox-artifacts-cleanup
        if: always()
