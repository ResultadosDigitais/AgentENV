syntax = "proto3";

package scheduler.v1;

option go_package = "agentenv/services/api/proto;schedulerv1";

service Scheduler {
  rpc Schedule(ScheduleRequest) returns (ScheduleResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc LookupNode(LookupNodeRequest) returns (LookupNodeResponse);
  rpc RecordAssignment(RecordAssignmentRequest) returns (RecordAssignmentResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportSandboxEvent(ReportSandboxEventRequest) returns (ReportSandboxEventResponse);
  rpc ListObservedNodes(ListObservedNodesRequest) returns (ListObservedNodesResponse);
  rpc ListP2pPeers(ListP2pPeersRequest) returns (ListP2pPeersResponse);
  rpc RecordP2pArtifact(RecordP2pArtifactRequest) returns (RecordP2pArtifactResponse);
  rpc ForgetP2pArtifact(ForgetP2pArtifactRequest) returns (ForgetP2pArtifactResponse);
  rpc LookupP2pArtifact(LookupP2pArtifactRequest) returns (LookupP2pArtifactResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc UnregisterNode(UnregisterNodeRequest) returns (UnregisterNodeResponse);
  // ScheduleResume applies the same capacity rule a new sandbox goes through
  // before a paused sandbox resumes on its owner (or on another node when
  // cross_node_resume is enabled).
  rpc ScheduleResume(ScheduleResumeRequest) returns (ScheduleResumeResponse);
  // SettleAdmission releases the reservation an admitted Schedule or
  // ScheduleResume created, once the gateway knows whether the sandbox was
  // actually created or resumed. Best-effort and idempotent.
  rpc SettleAdmission(SettleAdmissionRequest) returns (SettleAdmissionResponse);
}

message Node {
  string node_id = 1;
  string endpoint = 2;
}

// ScheduleRequestHint carries structured information parsed from the incoming
// request so the scheduler can make a more informed placement decision. Only
// request types that benefit from scheduling hints are represented; other
// requests omit the hint entirely.
message ScheduleRequestHint {
  oneof kind {
    NewColdSandboxHint new_cold_sandbox = 1;
    NewSandboxHint new_sandbox = 2;
  }
  // Named node pool the request asks for. The scheduler only considers nodes
  // whose pool equals this value, and an empty pool only matches nodes without
  // a pool. Enforcing, unlike the advisory fields of the typed hint.
  string pool = 3;
}

// NewColdSandboxHint describes a POST /sandboxes-cold request.
message NewColdSandboxHint {
  uint32 cpu_count = 1;
  uint64 memory_mb = 2;
  // OCI image references involved in the cold start: the rootfs image plus any
  // attached-drive images.
  repeated string images = 3;
  // Sandbox metadata key/value pairs parsed from the request body.
  map<string, string> metadata = 4;
}

// TemplateShapeStatus reports whether the gateway could resolve the shape of a
// template before scheduling a create. Zero means the gateway did not report
// it (an older gateway, or a create whose body already carries its shape).
enum TemplateShapeStatus {
  TEMPLATE_SHAPE_STATUS_UNSPECIFIED = 0;
  TEMPLATE_SHAPE_STATUS_RESOLVED = 1;
  TEMPLATE_SHAPE_STATUS_NOT_FOUND = 2;
  TEMPLATE_SHAPE_STATUS_LOOKUP_FAILED = 3;
  TEMPLATE_SHAPE_STATUS_UNAVAILABLE = 4;
}

// NewSandboxHint describes a POST /sandboxes request.
message NewSandboxHint {
  // Sandbox metadata key/value pairs parsed from the request body.
  map<string, string> metadata = 1;
  // Requested shape when the body carries it; 0 means the template default
  // applies and the scheduler can only reserve a slot.
  uint32 cpu_count = 2;
  uint64 memory_mb = 3;
  // Shape of the template resolved by the gateway before scheduling, used
  // when the body does not carry memory_mb. Zero when unresolved.
  uint64 resolved_memory_mb = 4;
  uint32 resolved_cpu_count = 5;
  TemplateShapeStatus template_shape_status = 6;
  // Template identifier the shape was resolved from; empty when absent.
  string template_id = 7;
}

message ScheduleRequest {
  reserved 1;  // formerly: string hint = 1
  ScheduleRequestHint hint = 2;
}

// ScheduleRefusalReason is the closed set of reasons a Schedule call refused
// to pick a node for a request that is otherwise syntactically valid. Zero
// means admitted.
enum ScheduleRefusalReason {
  SCHEDULE_REFUSAL_REASON_UNSPECIFIED = 0;
  // The create targets a template whose shape the gateway could not read and
  // the shape rule would have to admit it blind. Retryable.
  SCHEDULE_REFUSAL_REASON_UNKNOWN_TEMPLATE_SHAPE = 1;
}

message ScheduleResponse {
  Node node = 1;
  // Opaque reservation id the gateway settles once the create outcome is
  // known. Empty when the reservation ledger is disabled.
  string reservation_id = 2;
  // Closed refusal reason; UNSPECIFIED means a node was selected. The gateway
  // maps UNKNOWN_TEMPLATE_SHAPE to a retryable 503.
  ScheduleRefusalReason refusal_reason = 3;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message LookupNodeRequest {
  string sandbox_id = 1;
}

message LookupNodeResponse {
  Node node = 1;
}

message RecordAssignmentRequest {
  string sandbox_id = 1;
  Node node = 2;
}

message RecordAssignmentResponse {}

message MachineInfo {
  string cpu_family = 1;
  string cpu_model = 2;
  string cpu_model_name = 3;
  string cpu_architecture = 4;
  string cpu_config_json = 5;
}

message DiskMetric {
  string mount_point = 1;
  string device = 2;
  string filesystem_type = 3;
  uint64 used_bytes = 4;
  uint64 total_bytes = 5;
}

// NodeStatus describes the effective state of a node as derived by the
// scheduler from its discovery state and heartbeat history.
//
//   active  + heartbeat OK      → READY        — accepts new sandboxes
//   active  + no heartbeat      → CONNECTING    — discovered but not yet confirmed
//   active  + heartbeat timeout → UNHEALTHY     — heartbeat lost
//   lingering + heartbeat OK    → LINGERING     — terminating, draining existing work
//   lingering + no heartbeat    → CONNECTING    — terminating, never confirmed
//   lingering + heartbeat timeout → UNHEALTHY   — terminating, heartbeat lost
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_READY = 1;
  NODE_STATUS_CONNECTING = 2;
  NODE_STATUS_UNHEALTHY = 3;
  NODE_STATUS_LINGERING = 4;
}

message NodeSnapshot {
  NodeStatus status = 1;
  uint32 allocated_cpu = 2;
  uint64 allocated_memory_bytes = 3;
  uint32 cpu_percent = 4;
  uint32 cpu_count = 5;
  uint64 memory_used_bytes = 6;
  uint64 memory_total_bytes = 7;
  repeated DiskMetric disks = 8;
  uint32 sandbox_count = 9;
  uint32 sandbox_starting_count = 10;
  uint64 create_successes = 11;
  uint64 create_fails = 12;
  int64 reported_at_unix_ms = 13;
  // Paused-sandbox resource accounting. These are *not* included in
  // sandbox_count, allocated_cpu, or allocated_memory_bytes — those report the
  // active running set only. Paused sandboxes have released their VM-side
  // CPU / memory but still own persisted state on the node, so the scheduler
  // can use these fields (together with the active fields) to apply
  // "including paused" capacity limits.
  uint32 paused_sandbox_count = 14;
  uint32 paused_allocated_cpu = 15;
  uint64 paused_allocated_memory_bytes = 16;
  // Sum of effective memory *requests* of the active running set. Equals
  // allocated_memory_bytes unless sandboxes were created with an explicit
  // memory_request_mb below their nominal limit. Older nodes do not report it
  // (0). A node with allocated_memory_bytes > 0 always has requested > 0, so
  // "requested == 0 && allocated > 0" identifies a non-reporting node and the
  // scheduler falls back to allocated_memory_bytes (see filter.go).
  uint64 requested_memory_bytes = 17;
  // Memory working set of the runtime cgroup: memory.current minus
  // inactive_file, the figure kubelet reports, so reclaimable page cache does
  // not count as used. memory_used_bytes keeps the raw memory.current.
  // Absent when the node cannot read memory.stat or predates the field; the
  // scheduler then falls back to memory_used_bytes. Never reported as zero
  // for "unknown".
  optional uint64 memory_working_set_bytes = 18;
}

message P2pEndpoint {
  string backend = 1;
  string address = 2;
}

// AdmissionVerdict is the scheduler's admission decision for one VM shape on
// one node. reason is a closed set (memory_allocated, memory_used, cpu,
// starting, disk) and is empty when admitted.
message AdmissionVerdict {
  uint64 memory_gb = 1;
  bool admitted = 2;
  string reason = 3;
}

// NodeAdmission carries the capacity facts the verdict was computed over, so a
// reader can reproduce the decision without duplicating the rule.
message NodeAdmission {
  uint64 allocatable_memory_bytes = 1;
  uint64 runtime_overhead_bytes = 2;
  uint64 capacity_memory_bytes = 3;
  // "allocatable" or "total".
  string capacity_source = 4;
  repeated AdmissionVerdict layers = 5;
  // Shapes admitted and still in flight, already included in the verdicts.
  uint64 reserved_memory_bytes = 6;
  uint32 reserved_cpu = 7;
}

message ObservedNode {
  string node_id = 1;
  string endpoint = 2;
  string cluster_id = 3;
  string service_instance_id = 4;
  string version = 5;
  string commit = 6;
  MachineInfo machine_info = 7;
  NodeSnapshot snapshot = 8;
  int64 last_seen_unix_ms = 9;
  NodeAdmission admission = 10;
  // Named node pool the node agent reported in its configuration. Empty when
  // the node belongs to no pool (the shared nodes).
  string pool = 11;
}

// PausedSandboxResources is the persisted shape of one paused sandbox on the
// reporting node. The scheduler projects it when it decides whether a resume
// fits, so a resume goes through the same capacity rule as a new sandbox.
message PausedSandboxResources {
  string sandbox_id = 1;
  uint32 cpu_count = 2;
  uint64 memory_bytes = 3;
}

message HeartbeatRequest {
  string node_id = 1;
  string cluster_id = 2;
  string service_instance_id = 3;
  string version = 4;
  string commit = 5;
  MachineInfo machine_info = 6;
  NodeSnapshot snapshot = 7;
  repeated string sandbox_ids = 8;
  P2pEndpoint p2p_endpoint = 9;
  repeated PausedSandboxResources paused_sandboxes = 10;
  // Named node pool from the node agent's configuration. Empty means the node
  // is shared: it only receives sandboxes that did not ask for a pool.
  string pool = 11;
}

message HeartbeatResponse {
  string cpu_config_json = 1;
}

enum SandboxEventType {
  SANDBOX_EVENT_TYPE_UNSPECIFIED = 0;
  SANDBOX_EVENT_TYPE_CREATE = 1;
  SANDBOX_EVENT_TYPE_DELETE = 2;
  SANDBOX_EVENT_TYPE_PAUSE = 3;
  SANDBOX_EVENT_TYPE_RESUME = 4;
  // Fork events are reported once per child sandbox; sandbox_id and requested
  // resources refer to the child sandbox, not the source sandbox.
  SANDBOX_EVENT_TYPE_FORK = 5;
}

message SandboxEvent {
  string sandbox_id = 1;
  SandboxEventType event_type = 2;
  uint32 requested_cpu = 3;
  uint64 requested_memory_bytes = 4;
  uint64 requested_disk_bytes = 5;
}

message ReportSandboxEventRequest {
  string node_id = 1;
  string cluster_id = 2;
  string service_instance_id = 3;
  repeated SandboxEvent events = 4;
}

message ReportSandboxEventResponse {}

message ListObservedNodesRequest {
  string cluster_id = 1;
}

message ListObservedNodesResponse {
  repeated ObservedNode nodes = 1;
}

message P2pPeer {
  string node_id = 1;
  P2pEndpoint endpoint = 2;
}

message ListP2pPeersRequest {
  string cluster_id = 1;
  string backend = 2;
  string exclude_node_id = 3;
}

message ListP2pPeersResponse {
  repeated P2pPeer peers = 1;
}

message RecordP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string node_id = 4;
}

message RecordP2pArtifactResponse {}

message ForgetP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string node_id = 4;
}

message ForgetP2pArtifactResponse {}

message LookupP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string exclude_node_id = 4;
}

message LookupP2pArtifactResponse {
  repeated P2pPeer peers = 1;
}

message GetNodeRequest {
  string node_id = 1;
  string cluster_id = 2;
}

message GetNodeResponse {
  ObservedNode node = 1;
}

message UnregisterNodeRequest {
  string node_id = 1;
  string service_instance_id = 2;
}

message UnregisterNodeResponse {}

message ScheduleResumeRequest {
  string sandbox_id = 1;
  string cluster_id = 2;
  // Template shape of the paused sandbox. The gateway supplies it while the
  // node heartbeat does not carry per-sandbox paused resources yet; once the
  // heartbeat reports them, that figure wins.
  uint32 cpu_count = 3;
  uint64 memory_bytes = 4;
  // Named node pool the resume asks for. Empty only matches a node without a
  // pool; a non-empty pool only matches nodes of that pool.
  string pool = 5;
}

message ScheduleResumeResponse {
  Node node = 1;
  bool admitted = 2;
  // Closed admission reason (memory_allocated, memory_used, cpu, starting or
  // disk); empty when admitted.
  string reason = 3;
  // Opaque reservation id the gateway settles once the resume outcome is
  // known. Empty when admitted with the reservation ledger disabled.
  string reservation_id = 4;
}

message SettleAdmissionRequest {
  string reservation_id = 1;
  // Closed set: "confirmed" when the sandbox was created or resumed,
  // "failed" when the upstream rejected it or the request never completed.
  string outcome = 2;
}

message SettleAdmissionResponse {}
